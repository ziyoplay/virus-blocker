# Xcode loyihasi shu fayldan yaratiladi: `xcodegen generate` (Mac'da yoki GitHub Actions'da).
#
# App Group ishlatilmaydi: bepul Apple ID'da Apple uni yaratishga ruxsat bermaydi. Xavfsiz saytlar bazasi
# yig'ishdan oldin `swift run GenerateBlocklist Generated` bilan tayyorlanib, har bir qism ichiga joylanadi.
name: Qoriqchi
options:
  bundleIdPrefix: uz.apkqoriqchi
  deploymentTarget:
    iOS: "16.0"

packages:
  QoriqchiCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Qoriqchi:
    type: application
    platform: iOS
    sources:
      - App
      - path: Generated
        optional: true
        buildPhase: resources
        includes: ["*.bin"]
    dependencies:
      - package: QoriqchiCore
      - target: ContentBlocker
      - target: MessageFilter
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Qo'riqchi"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [uz.apkqoriqchi.ios.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.apkqoriqchi.ios
    scheme: {}

  ContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - ContentBlocker
      - path: Generated
        optional: true
        buildPhase: resources
        includes: ["blockerList.json"]
    dependencies:
      - package: QoriqchiCore
    info:
      path: ContentBlocker/Info.plist
      properties:
        CFBundleDisplayName: "Qo'riqchi"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.apkqoriqchi.ios.ContentBlocker

  MessageFilter:
    type: app-extension
    platform: iOS
    sources:
      - MessageFilter
      - path: Generated
        optional: true
        buildPhase: resources
        includes: ["*.bin"]
    dependencies:
      - package: QoriqchiCore
    info:
      path: MessageFilter/Info.plist
      properties:
        CFBundleDisplayName: "Qo'riqchi"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.apkqoriqchi.ios.MessageFilter
