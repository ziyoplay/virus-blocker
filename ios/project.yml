# Xcode loyihasi shu fayldan yaratiladi: `xcodegen generate` (Mac'da yoki GitHub Actions'da).
#
# App Group ishlatilmaydi: bepul Apple ID'da Apple uni yaratishga ruxsat bermaydi. Xavfli saytlar bazasi
# yig'ishdan oldin `swift run GenerateBlocklist Generated` bilan tayyorlanib, har bir qism ichiga joylanadi.
name: Qoriqchi
options:
  bundleIdPrefix: uz.apkqoriqchi
  deploymentTarget:
    iOS: "17.0"

packages:
  QoriqchiCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Versiya (CI'da buyruq qatoridan almashtiriladi): oila — standart, hacker — HACKER belgisi bilan
    BASE_BUNDLE_ID: uz.apkqoriqchi.ios.family
    APP_DISPLAY_NAME: "Qo'riqchi"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Family

targets:
  Qoriqchi:
    type: application
    platform: iOS
    sources:
      - App
      - path: Generated
        optional: true
        buildPhase: resources
        includes: ["*.bin"]
    dependencies:
      - package: QoriqchiCore
      - target: ContentBlocker
      - target: MessageFilter
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [uz.apkqoriqchi.ios.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
    scheme: {}

  ContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - ContentBlocker
      - path: Generated
        optional: true
        buildPhase: resources
        includes: ["blockerList.json"]
    dependencies:
      - package: QoriqchiCore
    info:
      path: ContentBlocker/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).ContentBlocker

  MessageFilter:
    type: app-extension
    platform: iOS
    sources:
      - MessageFilter
      - path: Generated
        optional: true
        buildPhase: resources
        includes: ["*.bin"]
    dependencies:
      - package: QoriqchiCore
    info:
      path: MessageFilter/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).MessageFilter
