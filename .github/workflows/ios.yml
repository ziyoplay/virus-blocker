name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  # Har kuni: Safari bloklovchi va SMS filtri bazasi IPA ichida, shuning uchun uni yangi bazali qilib qayta yig'amiz.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Umumiy mantiq testlari (qoidalar, baza)
        run: swift test --package-path ios/Core

      - name: Xavfli saytlar bazasini tayyorlash
        run: swift run --package-path ios/Core GenerateBlocklist "$PWD/ios/Generated"

      - name: Xcode loyihasini yaratish
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Yig'ish (imzosiz)
        run: |
          cd ios
          xcodebuild -project Qoriqchi.xcodeproj -scheme Qoriqchi -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      # Imzosiz IPA: Impactor / Sideloadly uni o'z Apple ID'ingiz bilan imzolaydi.
      - name: IPA
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Qoriqchi.app Payload/
          ls -la Payload/Qoriqchi.app/PlugIns/*/ | grep -E "blockerList|\.bin"
          zip -qry Qoriqchi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Qoriqchi-ipa
          path: ios/Qoriqchi.ipa
